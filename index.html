<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>海斗速查 · 海克斯大乱斗</title>
<style>
:root{
  --bg:#0b1220;--card:#141c2e;--card2:#1b2438;--line:#26304a;
  --tx:#e8edf7;--tx2:#93a0bd;--tx3:#5f6d8c;
  --s:#ff5d73;--a:#ffb020;--b:#4fa3ff;--c:#8b8fa0;--d:#6b7280;
  --pri:#0ac8b9;--gold:#ffcf5c;--acc:#c084fc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft Yahei",sans-serif}
body{padding-bottom:64px}
a{color:var(--pri);text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{max-width:820px;margin:0 auto;padding:8px 12px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--pri);box-shadow:0 0 10px var(--pri)}
.brand small{margin-left:auto;font-weight:400;color:var(--tx3);font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;margin-top:8px}
.search input{width:100%;padding:11px 36px 11px 36px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-size:16px;outline:none}
.search input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(10,200,185,.12)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.search .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:none;
  width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;
  background:var(--card2);color:var(--tx2);font-size:14px;border:0}
.search.has .clr{display:block}

/* ---------- 标签栏 ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--tx2);font-size:13px;white-space:nowrap}
.tab.on{background:var(--pri);color:#04211f;border-color:var(--pri);font-weight:600}

/* ---------- 通用 ---------- */
.sec{margin-top:14px}
.h2{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px;color:var(--tx2);font-weight:600;
  letter-spacing:.04em}
.h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.muted{color:var(--tx2)}
.tiny{font-size:12px;color:var(--tx3)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;line-height:18px}
.t-S{background:rgba(255,93,115,.16);color:var(--s)}
.t-A{background:rgba(255,176,32,.16);color:var(--a)}
.t-B{background:rgba(79,163,255,.16);color:var(--b)}
.t-C{background:rgba(139,143,160,.18);color:var(--c)}
.t-D{background:rgba(107,114,128,.2);color:var(--d)}
.p-棱彩{background:rgba(192,132,252,.18);color:var(--acc)}
.p-黄金{background:rgba(255,207,92,.18);color:var(--gold)}
.p-白银{background:rgba(200,214,232,.16);color:#c8d6e8}
.wr{color:var(--pri);font-weight:700}
.bad{color:var(--s)}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.hidden{display:none!important}
mark{background:rgba(10,200,185,.25);color:var(--tx);border-radius:3px;padding:0 2px}

/* ---------- 英雄列表 ---------- */
.hero{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;margin-bottom:6px;min-width:0}
.hero .main{flex:1 1 auto;min-width:0;overflow:hidden}
.hero .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .sub{font-size:11px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .right{flex:0 0 auto;text-align:right;max-width:34%}
.hero .right .w{font-weight:700;font-size:15px;white-space:nowrap}
.hero .pri{font-size:11px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .go{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);color:var(--tx2);
  border-radius:8px;padding:5px 8px;font-size:12px}
.rank{flex:0 0 26px;text-align:center;color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums}

/* ---------- 详情 ---------- */
.detail{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.detail h3{margin:14px 0 6px;font-size:12px;color:var(--tx2);letter-spacing:.05em;font-weight:600}
.detail h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:13px}
.kv .k{color:var(--tx3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12.5px}
.chip.star{background:rgba(255,207,92,.1);border-color:rgba(255,207,92,.45);color:var(--gold);font-weight:600}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;color:var(--tx3);font-weight:500;padding:5px 4px;border-bottom:1px solid var(--line);font-size:11px}
table.tb td{padding:5px 4px;border-bottom:1px solid rgba(38,48,74,.5)}
table.tb tr:last-child td{border-bottom:0}
.faqq{font-weight:600;margin:10px 0 2px;font-size:13px}
.faqa{color:var(--tx2);font-size:13px}
.buff{font-size:12.5px;color:var(--tx2)}
.buff b{color:var(--pri)}
.buff .neg b{color:var(--s)}

/* ---------- 符文 ---------- */
.aug{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.aug .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aug .nm{font-weight:600}
.aug .d{color:var(--tx2);font-size:12.5px;margin-top:4px}
.aug .src{font-size:11px;color:var(--tx3);margin-top:4px}

/* ---------- 补丁 ---------- */
.patch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.patch h4{margin:0;font-size:15px}
.patch .meta{font-size:11px;color:var(--tx3);margin-top:2px}
.patch .sum{font-size:12.5px;color:var(--tx2);margin:8px 0}
.plist{margin:6px 0 0;padding-left:0;list-style:none}
.plist li{padding:6px 0;border-top:1px solid rgba(38,48,74,.6);font-size:13px}
.plist li .n{font-weight:600}
.plist li .c{display:block;color:var(--tx2);font-size:12px;margin-top:1px}
.bt{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:6px}
.bt.add{background:rgba(10,200,185,.15);color:var(--pri)}
.bt.adj{background:rgba(255,176,32,.15);color:var(--a)}
.bt.del{background:rgba(255,93,115,.15);color:var(--s)}

/* ---------- 空状态 / 底栏 ---------- */
.empty{text-align:center;color:var(--tx3);padding:40px 0;font-size:13px}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(11,18,32,.96);border-top:1px solid var(--line);
  font-size:11px;color:var(--tx3);text-align:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
/* ---------- 悬浮窗模式（Tauri）：body 透明，只有卡片有背景 ---------- */
body.desktop{
  background:transparent;
  padding:0; margin:0;
  --bg:rgba(10,16,30,.93);
  border:1px solid rgba(120,160,255,.16);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.45);
  transition:opacity .12s ease;
}
body.desktop .wrap{max-width:none;padding:0 8px 8px;
  opacity:var(--win-op,1);transition:opacity .12s ease}
body.desktop header{opacity:var(--win-op,1);transition:opacity .12s ease}
body.desktop footer{display:none}
body.desktop .totop{bottom:14px;right:10px}
body.desktop header{background:transparent;border-bottom:1px solid var(--line);padding-top:0}
body.desktop .head{padding:0 8px 8px;max-width:none}
/* 拖动条 */
.titlebar{display:none;align-items:center;gap:8px;padding:5px 6px 5px 10px;
  background:rgba(255,255,255,.04);border-bottom:1px solid var(--line);
  cursor:grab;user-select:none;-webkit-user-select:none}
body.desktop .titlebar{display:flex}
.titlebar:active{cursor:grabbing}
.titlebar .t{font-size:12px;color:var(--tx2);font-weight:600;letter-spacing:.03em}
.titlebar .sp{flex:1}
.tb.opbtn{width:auto;min-width:38px;padding:0 6px;font-size:11px;font-weight:600;
  color:var(--pri);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tb.opbtn:hover{background:rgba(10,200,185,.18)}
/* 透明度滑块面板 */
.oppanel{position:absolute;right:8px;top:34px;z-index:60;display:none;
  background:#141c2e;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.5);width:190px}
.oppanel.on{display:block}
.oppanel label{font-size:11px;color:var(--tx2);display:flex;justify-content:space-between;margin-bottom:6px}
.oppanel output{color:var(--pri);font-weight:700;font-variant-numeric:tabular-nums}
.oppanel input[type=range]{width:100%;accent-color:var(--pri);cursor:pointer}
.oppanel .pre{display:flex;gap:4px;margin-top:8px}
.oppanel .pre button{flex:1;font-size:10px;padding:3px 0;border-radius:6px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx2);cursor:pointer}
.oppanel .pre button:hover{background:rgba(10,200,185,.18);color:var(--pri)}
body.pass .oppanel{display:none}
.tb{width:24px;height:22px;border-radius:6px;border:0;background:transparent;color:var(--tx2);
  font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.tb:hover{background:rgba(255,255,255,.1);color:var(--tx)}
.tb.close:hover{background:rgba(255,93,115,.25);color:#ff8093}
/* 悬浮窗里标题已在拖拽条显示，隐藏重复的品牌行，只留版本信息 */
body.desktop .brand{display:none}
body.desktop header{border-bottom:0}
body.desktop .head{padding-top:6px}
body.desktop .verline-desk{display:block}
.verline-desk{display:none;font-size:10px;color:var(--tx3);text-align:right;margin:0 2px 6px}
body.desktop .search input{padding:8px 34px 8px 32px}
body.desktop .tab{padding:5px 10px;font-size:12px}
body.desktop .hero{padding:8px 9px;margin-bottom:4px}
body.desktop .detail{padding:11px}
/* 穿透态：窗口已被 Rust 缩成只剩标题条，内容区在视觉上隐藏即可 */
body.pass main,
body.pass header,
body.pass .wrap,
body.pass .totop{display:none}
body.pass .titlebar{background:rgba(255,176,32,.12)}
body.pass .tb[data-act="pass"]{background:rgba(255,176,32,.25);color:var(--a)}
/* 标题条在穿透态下占满整个窗口高度 */
body.pass{display:flex;flex-direction:column;justify-content:center}
/* 穿透态提示：显示在标题栏内，随窗口一起收缩，不会盖住按钮 */
.passhint{display:none;font-size:11px;color:var(--a);margin-left:8px;font-weight:600}
body.pass .passhint{display:inline}

.totop{position:fixed;right:14px;bottom:52px;width:36px;height:36px;border-radius:50%;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2);display:none;align-items:center;
  justify-content:center;font-size:16px}
.badge-n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--card2);
  color:var(--tx2);font-size:11px;text-align:center;margin-left:6px}
</style>

<script>
(function(){
  // 两种分发方式：
  //   1) 单文件 H5 —— payload 里内嵌了全部数据，离线可用
  //   2) 悬浮窗 / 网页 —— payload 为空，改为 fetch('data.json')
  function boot(D){
  var M = D.meta;
  var state = {view:'heroes', q:'', slug:null};

  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function hi(s, q){
    s = esc(s);
    if(!q) return s;
    try{
      var re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      return s.replace(re,'<mark>$1</mark>');
    }catch(e){ return s; }
  }
  function tierTag(t){ return t ? '<span class="tag t-'+t+'">'+t+'</span>' : ''; }
  function rarTag(r){ return r ? '<span class="tag p-'+esc(r)+'">'+esc(r)+'</span>' : ''; }

  // ---------------- 头部信息 ----------------
  var verTxt = '游戏 ' + (M.game_version||'?') + ' · 数据 ' + (M.sync_date||'');
  $('#verline').textContent = verTxt;
  var vd = document.getElementById('verline-desk');
  if (vd) vd.textContent = verTxt;
  $('#foot').innerHTML = '采集 ' + esc(M.collected_at ? M.collected_at.replace('T',' ').slice(0,16) : '?') +
    ' · 生成 ' + esc(M.generated_at) + ' · 数据源 aramkit + arammayhem';

  // ---------------- 搜索 ----------------
  var qEl = $('#q'), box = $('#searchbox');
  qEl.addEventListener('input', function(){
    state.q = qEl.value.trim();
    box.classList.toggle('has', !!state.q);
    if(state.slug){ state.slug = null; }
    render();
  });
  $('#clr').onclick = function(){ qEl.value=''; state.q=''; box.classList.remove('has'); state.slug=null; render(); qEl.focus(); };

  document.querySelectorAll('#tabs .tab').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('#tabs .tab').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      state.view = b.dataset.v; state.slug = null; render(); window.scrollTo(0,0);
    };
  });

  // ---------------- 英雄详情 ----------------
  window.openHero = function(slug){
    state.view='heroes'; state.slug=slug;
    document.querySelectorAll('#tabs .tab').forEach(function(x){ x.classList.toggle('on', x.dataset.v==='heroes'); });
    render(); window.scrollTo(0,0);
  };
  window.closeHero = function(){ state.slug=null; render(); };

  function heroMatches(h, q){
    if(!q) return true;
    var hay = [h.name, h.role, h.top_prismatic, h.skill_order,
      (h.build||[]).join(','), (h.telemetry||[]).map(function(t){return t.choice;}).join(','),
      (h.augment_stats||[]).map(function(a){return a.name;}).join(',')].join(' ').toLowerCase();
    return hay.indexOf(q.toLowerCase()) >= 0;
  }

  function renderHeroes(){
    var q = state.q;
    if(state.slug){
      var h = D.heroes.find(function(x){ return x.slug===state.slug; });
      if(h) return renderHeroDetail(h);
    }
    var list = D.heroes.filter(function(h){ return heroMatches(h,q); });
    var out = '';
    if(!list.length) return '<div class="empty">没有匹配的英雄</div>';
    var lastTier = null;
    list.forEach(function(h){
      if(q){
        // 搜索时按胜率排，不分组
      } else if(h.tier !== lastTier){
        out += '<div class="sec"><div class="h2">' + h.tier + ' 级 · ' +
          tierTag(h.tier) + ' <span class="badge-n">' +
          D.heroes.filter(function(x){return x.tier===h.tier;}).length + '</span></div></div>';
        lastTier = h.tier;
      }
      out += '<div class="hero" data-slug="'+h.slug+'">' +
        '<div class="rank">' + (q ? '' : '#'+h.rank) + '</div>' +
        '<div class="main"><div class="nm">' + hi(h.name,q) + '</div>' +
          '<div class="sub">' + esc(h.role||'') + (h.skill_order?' · '+esc(h.skill_order):'') + '</div></div>' +
        '<div class="right"><div class="w wr">' + h.wr.toFixed(1) + '%</div>' +
          '<div class="pri">' + hi(h.top_prismatic,q) + '</div></div>' +
        '<div class="go">›</div>' +
      '</div>';
    });
    return '<div class="sec"><div class="tiny" style="margin:0 0 8px">共 ' + list.length +
      ' 位英雄 · 胜率来自国服 ' + (M.games_wan||'') + ' 万场（' + esc(M.sync_date||'') +
      '）· 点「详情」看该英雄出装与海克斯</div></div>' + out;
  }

  function renderHeroDetail(h){
    var o = '';
    o += '<button class="chip" data-act="close-hero">‹ 返回列表</button>';
    o += '<div class="detail">';
    o += '<div class="row spread"><div><span class="nm" style="font-size:20px;font-weight:700">' +
      esc(h.name) + '</span> ' + tierTag(h.tier) + ' <span class="tiny">#'+h.rank+'</span></div>' +
      '<div style="text-align:right"><div class="wr" style="font-size:20px">' + h.wr.toFixed(1) + '%</div>' +
      '<div class="tiny">选取 '+h.pick.toFixed(1)+'%</div></div></div>';
    if(h.blurb) o += '<div class="tiny" style="margin-top:4px">'+esc(h.blurb)+'</div>';

    o += '<h3>模式专属调整</h3><div class="chips">';
    if(h.mode_buffs.length){
      h.mode_buffs.forEach(function(b){
        var neg = /[-−]/.test(b);
        o += '<span class="chip buff'+(neg?' neg':'')+'">'+esc(b)+'</span>';
      });
    } else o += '<span class="tiny">该英雄没有模式专属调整（100% 基准）</span>';
    o += '</div>';

    o += '<h3>核心出装</h3><div class="chips">';
    (h.build||[]).forEach(function(x,i){
      o += '<span class="chip">'+(i+1)+'. '+esc(x)+'</span>';
    });
    o += '</div>';
    if((h.alt_items||[]).length){
      o += '<div class="tiny" style="margin-top:4px">备选：'+h.alt_items.map(esc).join(' · ')+'</div>';
    }
    if((h.top3||[]).length){
      o += '<div class="tiny" style="margin-top:4px">实测高胜率三件套：'+h.top3.map(esc).join(' → ')+'</div>';
    }

    o += '<h3>加点与召唤师技能</h3><div class="kv">';
    if(h.skill_order) o += '<span class="k">加点</span><span>'+esc(h.skill_order)+'</span>';
    (h.telemetry||[]).filter(function(t){ return /召唤师/.test(t.kind); }).forEach(function(t){
      o += '<span class="k">召唤师</span><span>'+esc(t.choice)+' <span class="wr">'+t.wr+'%</span></span>';
    });
    o += '</div>';

    o += '<h3>海克斯优先级 <span class="tiny">（★ = 必拿）</span></h3>';
    ['白银海克斯','金色海克斯','棱彩海克斯'].forEach(function(k){
      var arr = (h.augments||{})[k];
      if(!arr || !arr.length) return;
      var rar = k.replace('海克斯','').replace('银色','白银');
      o += '<div style="margin:6px 0 3px">'+rarTag(rar)+'</div><div class="chips">';
      arr.forEach(function(a){
        o += '<span class="chip'+(a.star?' star':'')+'"'+(a.note?' title="'+esc(a.note)+'"':'')+'>'+
          (a.star?'★ ':'')+esc(a.name)+(a.note?' <span class="tiny">'+esc(a.note)+'</span>':'')+'</span>';
      });
      o += '</div>';
    });

    if((h.augment_stats||[]).length){
      o += '<h3>该英雄的实测海克斯胜率</h3><table class="tb"><tr><th>#</th><th>海克斯</th>' +
        '<th>胜率</th><th>选取</th></tr>';
      h.augment_stats.forEach(function(a,i){
        o += '<tr><td>'+(i+1)+'</td><td>'+esc(a.name)+'</td><td class="wr">'+
          (a.wr==null?'—':a.wr.toFixed(1)+'%')+'</td><td class="tiny">'+
          (a.pick==null?'—':a.pick.toFixed(1)+'%')+'</td></tr>';
      });
      o += '</table>';
    }

    if((h.faq||[]).length){
      o += '<h3>陷阱提醒</h3>';
      h.faq.forEach(function(f){
        o += '<div class="faqq">'+esc(f.q)+'</div><div class="faqa">'+esc(f.a)+'</div>';
      });
    }
    o += '</div>';
    return o;
  }

  // ---------------- 符文 ----------------
  function renderAugments(){
    var q = state.q.toLowerCase();
    var list = D.augments.filter(function(a){
      if(!q) return true;
      return (a.name+' '+(a.desc||'')+' '+(a.rarity||'')).toLowerCase().indexOf(q) >= 0;
    });
    if(!list.length) return '<div class="empty">没有匹配的强化符文</div>';
    var out = '<div class="sec"><div class="tiny" style="margin-bottom:8px">共 '+list.length+
      ' 个符文 · 胜率为该符文全部对局的全局胜率（不区分英雄）· 评级两源并列：mayhem / kit</div></div>';
    list.forEach(function(a){
      out += '<div class="aug"><div class="top">'+(a.rarity?rarTag(a.rarity):'')+
        '<span class="nm">'+hi(a.name,q)+'</span>';
      if(a.grade_mayhem) out += '<span class="tag t-'+a.grade_mayhem[0]+'">'+a.grade_mayhem+'</span>';
      if(a.grade_kit) out += '<span class="tag t-'+a.grade_kit[0]+'">kit '+a.grade_kit+'</span>';
      if(a.wr_kit!=null) out += '<span class="tiny">全局胜率 <b class="wr">'+a.wr_kit.toFixed(1)+'%</b>'+
        (a.pick_kit!=null?' · 选取 '+a.pick_kit.toFixed(1)+'%':'')+'</span>';
      out += '</div>';
      if(a.desc) out += '<div class="d">'+hi(a.desc,q)+'</div>';
      else out += '<div class="d" style="opacity:.5">（暂无效果说明，可在游戏内查看）</div>';
      out += '</div>';
    });
    return out;
  }

  // ---------------- 补丁 ----------------
  function renderPatches(){
    var q = state.q.toLowerCase();
    var out = '';
    D.patches.forEach(function(p){
      var items = [];
      (p.added||[]).forEach(function(x){ items.push({k:'add', n:x.name, d:x.desc, r:x.rarity}); });
      (p.adjusted||[]).forEach(function(x){ items.push({k:'adj', n:x.name, d:x.desc, r:x.rarity}); });
      (p.removed||[]).forEach(function(x){ items.push({k:'del', n:x.name, d:x.desc, r:x.rarity}); });
      if(q){
        items = items.filter(function(x){ return ((x.n||'')+' '+(x.d||'')).toLowerCase().indexOf(q)>=0; });
        if(!items.length) return;
      }
      out += '<div class="patch"><h4>'+esc(p.title||('海克斯大乱斗 '+p.version))+'</h4>'+
        '<div class="meta">'+esc(p.date||'')+' · '+(p.counts.added||0)+' 新增 / '+
        (p.counts.adjusted||0)+' 调整 / '+(p.counts.removed||0)+' 移除</div>';
      (p.summary||[]).forEach(function(s){ out += '<div class="sum">'+esc(s)+'</div>'; });
      out += '<ul class="plist">';
      items.forEach(function(x){
        out += '<li><span class="bt '+x.k+'">'+(x.k==='add'?'新':x.k==='adj'?'调':'删')+'</span>' +
          '<span class="n">'+hi(x.n,q)+'</span>' + (x.r?' <span class="tiny">'+esc(x.r)+'</span>':'') +
          (x.d?'<span class="c">'+hi(x.d,q)+'</span>':'') + '</li>';
      });
      out += '</ul></div>';
    });
    return out || '<div class="empty">没有匹配的补丁条目</div>';
  }

  // ---------------- 说明 ----------------
  function renderAbout(){
    var s = M.sources||{};
    return '<div class="sec"><div class="card">' +
      '<h3 style="margin-top:0;font-size:15px;color:var(--tx)">数据来源与口径</h3>' +
      '<div class="kv">' +
      '<span class="k">游戏版本</span><span>'+esc(M.game_version||'?')+'</span>' +
      '<span class="k">数据快照</span><span>'+esc(M.sync_date||'?')+'（国服 '+(M.games_wan||'?')+' 万场）</span>' +
      '<span class="k">采集时间</span><span>'+esc(M.collected_at||'?')+'</span>' +
      '<span class="k">生成时间</span><span>'+esc(M.generated_at)+'</span>' +
      '<span class="k">英雄</span><span>'+M.hero_count+' 位</span>' +
      '<span class="k">符文</span><span>'+M.augment_count+' 个</span>' +
      '</div>' +
      '<h3>来源</h3><div class="tiny">' +
      '· 英雄胜率 / 出装 / 加点 / 海克斯优先级：<a href="'+esc(s.cheatsheet||'')+'">aramkit 海克斯小秘书</a><br>' +
      '· 符文效果原文与 separate 评级：<a href="'+esc(s.aug_effects||'')+'">arammayhem 中文版</a>' +
      (M.aug_effects_updated?'（更新于 '+esc(M.aug_effects_updated)+'）':'')+'<br>' +
      '· 版本改动：<a href="'+esc(s.patches||'')+'">aramkit 版本记录</a><br>' +
      '</div>' +
      '<h3>怎么读这些数字</h3><div class="tiny">' +
      '· <b>胜率</b>是全服平均，不代表你打得好；同一个英雄在不同段位差异很大。<br>' +
      '· <b>海克斯特定胜率</b>（某英雄拿到某个符文后的胜率）已经剔除英雄本身强度，是选符文最该看的数。<br>' +
      '· 两个站点对同一颗符文的胜率口径不同，所以这里并列显示，不做平均。<br>' +
      '· 版本更新后 1~3 天内数据还没稳定，新补丁刚上时以「补丁」页的改动为准。<br>' +
      '</div>' +
      '<h3>更新方式</h3><div class="tiny">' +
      '本页是单文件 H5，完全离线可用。每天定时任务重新采集后，替换这个文件即可。<br>' +
      '离线打开时数据停留在生成时间，不会自动刷新。' +
      '</div>' +
      '</div></div>';
  }

  // ---------------- 主渲染 ----------------
  function render(){
    var m = $('#main'), html = '';
    if(state.view==='heroes') html = renderHeroes();
    else if(state.view==='augments') html = renderAugments();
    else if(state.view==='patches') html = renderPatches();
    else html = renderAbout();
    m.innerHTML = html;
    document.getElementById('totop').style.display = window.scrollY>400?'flex':'none';
  }

  // 事件委托：避免内联 onclick（Tauri 的 CSP 会拦截 inline 事件处理器）
  function bindDelegation(){
    var m = $('#main');
    if (!m || m.__bound) return;
    m.__bound = true;
    m.addEventListener('click', function(e){
      var hero = e.target.closest('.hero[data-slug]');
      if (hero && m.contains(hero)) { window.openHero(hero.dataset.slug); return; }
      var act = e.target.closest('[data-act]');
      if (act && m.contains(act)) {
        if (act.dataset.act === 'close-hero') { window.closeHero(); }
      }
    });
  }

  window.addEventListener('scroll', function(){
    document.getElementById('totop').style.display = window.scrollY>400?'flex':'none';
  });
  document.getElementById('totop').onclick = function(){ window.scrollTo({top:0,behavior:'smooth'}); };

  bindDelegation();
  render();
  }

  // ============ 悬浮窗模式（Tauri）============
  var TAURI = !!(window.__TAURI_INTERNALS__ || window.__TAURI__);
  var AUTO_PASSTHROUGH = /[?&]pass=1\b/.test(location.search); // 启动时直接穿透

  function isDesktop(){ return document.body.classList.contains('desktop'); }

  // ---- 透明度控制 ----
  // 两套入口：① 标题栏按钮循环切换；② 点开滑块面板随意拖
  var OP_PRESETS = [100, 85, 70, 50];
  var opIdx = 0;
  var opPct = 100;

  function applyOpacity(pct){
    pct = Math.max(30, Math.min(100, Math.round(pct)));
    opPct = pct;
    // 只淡化内容区，标题栏始终保持不透明（否则按钮会看不清、更难操作）
    document.documentElement.style.setProperty('--win-op', String(pct / 100));
    var btn = document.getElementById('opbtn');
    if (btn) btn.textContent = pct + '%';
    var out = document.getElementById('opout');
    if (out) out.textContent = pct + '%';
    var rng = document.getElementById('oprange');
    if (rng && Number(rng.value) !== pct) rng.value = String(pct);
    try { localStorage.setItem('mayhem.opacity', String(pct)); } catch(_){}
  }

  // 标题栏按钮：在预设档位间循环
  window.__cycleOpacity = function(){
    var cur = OP_PRESETS.indexOf(opPct);
    opIdx = cur >= 0 ? (cur + 1) % OP_PRESETS.length : 0;
    applyOpacity(OP_PRESETS[opIdx]);
  };
  // 供 Rust 端 F9 热键调用
  window.__setOpacity = function(pct){ applyOpacity(pct); };

  (function setupOpacityPanel(){
    var panel = document.getElementById('oppanel');
    var rng = document.getElementById('oprange');
    var btn = document.getElementById('opbtn');
    if (!panel || !rng) return;

    // 恢复上次设置
    try {
      var saved = Number(localStorage.getItem('mayhem.opacity'));
      if (saved >= 30 && saved <= 100) applyOpacity(saved);
    } catch(_){}

    rng.addEventListener('input', function(){ applyOpacity(Number(rng.value)); });
    panel.querySelectorAll('[data-op]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        applyOpacity(Number(b.dataset.op));
      });
    });
    // 点按钮：长按/右键出面板，短按循环
    if (btn){
      btn.addEventListener('contextmenu', function(e){
        e.preventDefault(); panel.classList.toggle('on');
      });
    }
    // 点面板外部关闭
    document.addEventListener('click', function(e){
      if (!panel.contains(e.target) && e.target !== btn) panel.classList.remove('on');
    });
  })();

  // 鼠标穿透开关
  //
  // 实现方式：穿透 = 把窗口收缩成「只剩标题栏的一条」，由 Rust 的 set_compact 完成。
  // 不用 set_ignore_cursor_events，因为那是整窗级穿透，连标题栏都点不到，开了就关不掉。
  var passOn = false;
  var savedHeight = null;   // 展开时的高度（逻辑像素），穿透后恢复用

  function applyPass(on){
    passOn = !!on;
    document.body.classList.toggle('pass', passOn);
    var b = document.querySelector('.tb[data-act="pass"]');
    if (b){
      b.textContent = passOn ? '◉' : '◎';
      b.title = passOn ? '已缩小为标题条（再点 / F10 展开）' : '缩小为标题条 (F10)';
    }

    if (!TAURI) return;
    var t = window.__TAURI_INTERNALS__;
    if (!t || !t.invoke) return;

    if (passOn){
      // 记录当前窗口高度，之后恢复用
      invoke('get_window_height').then(function(h){
        if (typeof h === 'number' && h > 0) savedHeight = h;
        t.invoke('set_compact', {on: true, savedHeight: savedHeight}).catch(function(){});
      }).catch(function(){
        t.invoke('set_compact', {on: true, savedHeight: savedHeight}).catch(function(){});
      });
    } else {
      t.invoke('set_compact', {on: false, savedHeight: savedHeight}).catch(function(){});
    }
  }

  // 统一的 invoke 包装：兼容 Tauri 2 的 __TAURI_INTERNALS__ 与旧版 __TAURI__
  function invoke(cmd, args){
    if (!TAURI) return Promise.resolve();
    var t = window.__TAURI_INTERNALS__;
    if (t && t.invoke) return t.invoke(cmd, args || {});
    var t2 = window.__TAURI__ && window.__TAURI__.core;
    if (t2 && t2.invoke) return t2.invoke(cmd, args || {});
    return Promise.resolve();
  }

  window.__togglePass = function(){ applyPass(!passOn); return passOn; };

  // 窗口控制按钮
  document.querySelectorAll('.tb').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var act = btn.dataset.act;
      if (act === 'op') { document.getElementById('oppanel').classList.toggle('on'); return; }
      else if (act === 'min') invoke('hide_window').catch(function(){});
      else if (act === 'close') invoke('quit_app').catch(function(){});
      else if (act === 'pass') applyPass(!passOn);
    });
  });

  // 拖动：使用 Tauri 内置的 data-tauri-drag-region（标题栏已标记），无需额外命令

  // 检测桌面环境并初始化
  document.body.classList.add(TAURI ? 'desktop' : 'web');
  if (AUTO_PASSTHROUGH) applyPass(true);

  // ---- 启动 ----
  var el = document.getElementById('payload');
  var raw = el ? el.textContent.trim() : '';
  if (raw) {
    boot(JSON.parse(raw));
  } else {
    fetch('data.json', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(boot)
      .catch(function(e){
        document.getElementById('main').innerHTML =
          '<div class="empty">数据加载失败：'+e.message+'<br><span class="tiny">'+
          '请确认 data.json 与页面在同一目录</span></div>';
      });
  }
})();
</script>
